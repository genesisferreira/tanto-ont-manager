<!DOCTYPE html><html><head><title>F6201B</title>
<script src="/jquery/jquery.min.js"></script>
<script src="/jquery/crypto-js.min.js"></script>
<script src="/jquery/jsencrypt.min.js"></script>
<script src="/jquery/common_lib.js"></script>
</head><body>
<p>Welcome to F6201B. Please login.</p>
<p>ZTE Corporation</p>
<p>&copy;2008-2025 ZTE Corporation</p>
<div class="loginInstCfgArea">
<input type="hidden" name="_sessionTOKEN" id="_sessionTOKEN" value=""/>
<label for="Frm_Username">Username</label>
<input type="text" name="Frm_Username" id="Frm_Username" autocomplete="off" value="" />
<label for="Frm_Password">Password</label>
<input type="password" name="Frm_Password" id="Frm_Password" autocomplete="off" value=""/>
<input type="submit" id="LoginId" class="button login" value="Login"/>
</div>
<script type="text/javascript">
function LogOff(){ $.post( "/?_type=loginData&_tag=logout_entry", {IF_LogOff:1, _sessionTOKEN:_sessionTmpToken}, undefined); }
function g_loginToken(xml) {
  var xmlObj = $(xml)[0].childNodes[0].textContent;
  var Password =$("#Frm_Password:not(.PostIgnore)").val();
  var SHA256Password =sha256(Password+xmlObj);
  var postData = {};
  postData["action"] = "login";
  postData["Password"] = SHA256Password;
  postData["Username"] = $("#Frm_Username").val();
  postData["_sessionTOKEN"] = $("#_sessionTOKEN").val();
  $.post( "/?_type=loginData&_tag=login_entry", postData, undefined, "json" )
  .done(function( data ) { $("#_sessionTOKEN").val(data.sess_token); if ( data.login_need_refresh ) { top.location.href = top.location.href; } else { DisplayLoginErrorTip(data); } });
}
function DisplayLoginErrorTip(loginData) { var loginErrMsg = loginData.loginErrMsg; var lockingTime = loginData.lockingTime; var promptMsg = loginData.promptMsg; }
$(document).ready(function(){
  $.getJSON("/?_type=loginData&_tag=login_entry").done(function( json ) { $("#_sessionTOKEN").val(json.sess_token); DisplayLoginErrorTip(json); });
  $("#LoginId").bind("click", function(){ var loadAllowAddr = "/?_type=loginData&_tag=login_token"; $(this).dataTransfer(loadAllowAddr, "GET", g_loginToken, undefined, false); });
});
function openLink(pageurl, areaId) { var PageName = "/?_type=menuView&_tag=" + pageurl; AjaxPageGet(PageName, 1, areaId); }
function AjaxQuery_ClassMenuClick(MenuOBJ) { var page = MenuOBJ.attr("MenuPage"); var pageFile = "/?_type=menuView&_tag=" + page + "&Menu3Location=0"; AjaxPageGet(pageFile, MenuOBJ.attr("MenuClass")); }
if ( "mmHome" == selectPageID ) { }
</script></body></html>
